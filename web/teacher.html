<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civitas — Teacher Voice Screen</title>
<style>
  :root{
    --bg:#12131a; --panel:#1b1d29; --panel2:#232537; --line:#2e3146;
    --ink:#f3f4f8; --ink-dim:#9a9db3; --accent:#7c8cff; --accent2:#5ee6c4;
    --warn:#ffb454; --d1:#7c8cff; --d2:#5ee6c4; --d3:#ff8fb1; --d4:#ffcf6b;
    --d5:#c79bff; --d6:#6bd0ff; --radius:16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); min-height:100vh;}
  .screen{max-width:1200px; margin:0 auto; padding:24px;}

  /* --- Login --- */
  #login-screen{max-width:380px; margin:12vh auto; padding:32px; background:var(--panel);
    border-radius:var(--radius); border:1px solid var(--line);}
  #login-screen h1{font-size:20px; margin:0 0 4px;}
  #login-screen p{color:var(--ink-dim); font-size:14px; margin:0 0 20px;}
  input, textarea{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel2); color:var(--ink); font-size:15px; margin-bottom:12px; font-family:inherit;}
  button{cursor:pointer; border:none; border-radius:10px; font-weight:600; font-family:inherit;}
  .btn-primary{background:var(--accent); color:#0d0e14; padding:12px 18px; font-size:15px; width:100%;}
  .btn-primary:hover{filter:brightness(1.08);}
  #login-error{color:var(--warn); font-size:13px; min-height:18px; margin-top:-4px; margin-bottom:8px;}

  /* --- App shell --- */
  #app{display:none;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
  header h1{font-size:18px; margin:0;}
  header .sub{color:var(--ink-dim); font-size:13px;}
  #logout{background:transparent; color:var(--ink-dim); font-size:13px; padding:6px 10px;}
  #logout:hover{color:var(--ink);}

  /* --- Voice (ODDIN-style immersive voice screen: floating mic + full-screen orb) --- */
  #vfab{position:fixed; right:20px; bottom:20px; z-index:60; display:flex; align-items:center; gap:10px; font-size:12px;}
  #vfab .vt{background:var(--panel); border:1px solid var(--line); color:var(--ink-dim); padding:6px 11px; border-radius:14px;
    white-space:nowrap; opacity:0; transform:translateX(8px); transition:all .25s; pointer-events:none;}
  #vfab.msg .vt{opacity:1; transform:none;}
  #vfab .vm{width:60px; height:60px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
    color:var(--ink-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.45); transition:all .2s; font-size:24px;}
  #vfab .vm:hover{color:var(--ink); border-color:var(--accent);}
  #vfab.on .vm{background:#10301e; color:#3ddc84; border-color:#22a866; animation:vfp 2.4s infinite;}
  #vfab.nosr .vm{opacity:.4; cursor:not-allowed;}
  @keyframes vfp{0%{box-shadow:0 0 0 0 rgba(34,168,102,.55);} 70%{box-shadow:0 0 0 18px rgba(34,168,102,0);} 100%{box-shadow:0 0 0 0 rgba(34,168,102,0);}}

  @property --h{syntax:'<number>'; inherits:true; initial-value:235;}
  #vx{position:fixed; inset:0; z-index:100; display:none; flex-direction:column; align-items:center; color:var(--ink);
    overflow:hidden; --h:235; transition:--h .6s ease;}
  #vx.show{display:flex; animation:vxin .35s ease;}
  @keyframes vxin{from{opacity:0; transform:scale(1.03);} to{opacity:1; transform:none;}}
  #vx .bg{position:absolute; inset:0; background:radial-gradient(900px 600px at 50% 30%, hsla(var(--h),60%,20%,.97), rgba(6,8,12,.985) 70%);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
  #vx .x{position:absolute; right:18px; top:14px; z-index:2; width:40px; height:40px; border-radius:50%;
    border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:var(--ink); font-size:20px; cursor:pointer;}
  #vx .main{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; width:100%; height:100%;
    padding:0 250px; box-sizing:border-box;}
  #vx .stage{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; margin-top:8vh;}
  #vx .orb{position:relative; width:220px; height:220px; display:flex; align-items:center; justify-content:center;}
  #vx .orb i{position:absolute; inset:40px; border-radius:50%; border:2px solid hsla(var(--h),75%,62%,.55); opacity:0;}
  #vx .core{position:relative; width:140px; height:140px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:42px; font-weight:800; letter-spacing:1px; color:#fff;
    background:radial-gradient(circle at 35% 30%, hsl(var(--h),70%,62%), hsl(var(--h),60%,34%) 60%, hsl(var(--h),55%,18%));
    box-shadow:0 0 60px hsla(var(--h),80%,55%,.45), inset 0 -8px 24px rgba(0,0,0,.35); transition:transform .3s;}
  #vx.listen .orb i{animation:vr 3.2s ease-out infinite;} #vx.listen .orb i:nth-child(2){animation-delay:1.05s;}
  #vx.listen .orb i:nth-child(3){animation-delay:2.1s;}
  #vx.speak .orb i{animation:vr 1.2s ease-out infinite;} #vx.speak .orb i:nth-child(2){animation-delay:.4s;}
  #vx.speak .orb i:nth-child(3){animation-delay:.8s;} #vx.speak .core{animation:vs .45s ease-in-out infinite alternate;}
  #vx.think .core:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid transparent;
    border-top-color:hsl(var(--h),80%,70%);border-right-color:hsla(var(--h),80%,70%,.4);animation:vsp 1s linear infinite;}
  @keyframes vr{0%{transform:scale(1); opacity:.7;} 100%{transform:scale(1.85); opacity:0;}}
  @keyframes vs{from{transform:scale(1);} to{transform:scale(1.07);}}
  @keyframes vsp{to{transform:rotate(360deg);}}
  #vx .nm{font-size:30px; font-weight:800; letter-spacing:2px; margin-top:10px; text-align:center; padding:0 16px;}
  #vx .rl{color:var(--ink-dim); margin-top:2px; text-align:center; max-width:560px; padding:0 16px;}
  #vx .stt{margin-top:10px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:hsl(var(--h),70%,72%); min-height:18px;}
  #vx .log{position:relative; z-index:1; width:min(680px,calc(100% - 32px)); margin-top:18px; display:flex; flex-direction:column;
    gap:10px; max-height:26vh; overflow-y:auto; padding:4px;}
  #vx .b{padding:10px 14px; border-radius:14px; max-width:88%; animation:vxin .25s ease;}
  #vx .b.a{align-self:flex-start; background:rgba(255,255,255,.07); border-left:3px solid hsl(var(--h),70%,58%);}
  #vx .b.m{align-self:flex-end; background:hsla(var(--h),50%,40%,.35);}
  #vx .b.n{align-self:center; background:none; color:var(--warn); font-size:12px; padding:2px;}
  #vx .rail{position:absolute; z-index:2; left:14px; top:18px; bottom:18px; width:210px; overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column; gap:2px; padding:4px 4px 4px 0; scrollbar-width:thin;}
  #vx .rail .rh{font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink-dim); margin:4px 8px 8px;}
  #vx .ra{display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:12px; cursor:pointer; border:1px solid transparent;
    background:none; color:var(--ink); text-align:left; font:inherit; width:100%; transition:background .2s, border-color .2s;}
  #vx .ra:hover{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.1);}
  #vx .ro{width:38px; height:38px; flex:0 0 38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:12.5px; color:#fff; box-sizing:border-box;
    background:radial-gradient(circle at 35% 30%, hsl(var(--rh),70%,60%), hsl(var(--rh),55%,30%) 65%, hsl(var(--rh),55%,18%));
    box-shadow:0 0 14px hsla(var(--rh),80%,55%,.28);}
  #vx .ra .rt{min-width:0;} #vx .ra .rn{font-weight:700; font-size:13px;}
  #vx .ra .rr{font-size:11px; color:var(--warn); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:130px;}
  #vx .ra.cur{opacity:.55; cursor:default;} #vx .ra.cur:hover{background:none; border-color:transparent;}
  #vx form{position:relative; z-index:1; display:flex; gap:8px; width:min(680px,calc(100% - 32px)); margin-top:auto; margin-bottom:10px;}
  #vx input{flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:12px; color:var(--ink);
    padding:10px 12px; font:inherit;} #vx input:focus{outline:none; border-color:hsl(var(--h),70%,60%);}
  #vx form button{background:hsl(var(--h),55%,40%); border:0; color:#fff; border-radius:12px; padding:0 16px; cursor:pointer; font:inherit;}
  #vx .hint{position:relative; z-index:1; color:var(--ink-dim); font-size:12px; margin-bottom:16px; text-align:center; padding:0 16px;}
  @media(max-width:1000px){
    #vx .main{padding:120px 12px 0;} #vx .stage{margin-top:2vh;}
    #vx .rail{top:56px; left:12px; right:12px; bottom:auto; width:auto; height:auto; max-height:100px; flex-direction:row;
      gap:6px; overflow-x:auto; overflow-y:hidden; padding:0;}
    #vx .rail .rh{display:none;} #vx .ra .rt{display:none;} #vx .ra{width:auto; padding:4px;}
  }
  @media(max-width:700px){#vx .orb{width:170px; height:170px;} #vx .core{width:110px; height:110px; font-size:32px;}}
  @media(prefers-reduced-motion:reduce){#vx .orb i, #vx.speak .core, #vx.think .core:after{animation:none;}}

  /* --- Roster --- */
  #roster{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; margin-bottom:28px;}
  .tile{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
    cursor:pointer; text-align:center; transition:border-color .15s, transform .15s;}
  .tile:hover{border-color:var(--accent); transform:translateY(-2px);}
  .tile.active{border-color:var(--accent2); box-shadow:0 0 0 2px rgba(94,230,196,.25);}
  .tile .avatar{width:52px; height:52px; border-radius:50%; margin:0 auto 10px; display:flex;
    align-items:center; justify-content:center; font-weight:700; font-size:18px; color:#0d0e14;}
  .tile .name{font-size:14px; font-weight:600;}
  .tile .flag{font-size:11px; color:var(--warn); margin-top:4px;}

  /* --- Detail panel --- */
  #detail{display:none; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:24px;}
  #detail h2{margin:0 0 4px; font-size:20px;}
  #detail .domain-tag{display:inline-block; font-size:11px; padding:3px 9px; border-radius:99px; margin-bottom:14px; font-weight:600;}
  .block{margin-bottom:18px;}
  .block h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin:0 0 6px;}
  .block p{margin:0; line-height:1.5; font-size:15px;}
  .needs{color:var(--warn); font-size:13px; margin-top:4px;}
  .activity-badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--accent2);
    background:rgba(94,230,196,.08); padding:5px 10px; border-radius:99px; margin-top:6px;}

  /* --- Persona settings --- */
  #persona-toggle{background:var(--panel2); color:var(--ink-dim); font-size:12px; padding:6px 12px;}
  #persona-panel{display:none; margin-top:14px; background:var(--panel2); border-radius:12px; padding:16px;}
  #persona-panel label{font-size:12px; color:var(--ink-dim); display:block; margin-bottom:6px;}
  #persona-panel textarea{min-height:80px; resize:vertical;}
  #persona-save{width:auto; padding:9px 16px; font-size:13px;}
  #persona-status{font-size:12px; color:var(--accent2); margin-left:10px;}

  .empty{color:var(--ink-dim); font-size:14px; text-align:center; padding:40px 0;}

  /* --- Weekly cards (card layout, per-domain grouped by week) --- */
  #wc-section{margin-top:22px;}
  #wc-section h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin:0 0 10px;}
  #wc-strip{display:flex; gap:14px; overflow-x:auto; padding-bottom:8px;}
  .wcard{flex:0 0 260px; background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:14px;}
  .wcard-head{font-size:13px; font-weight:700; margin-bottom:10px; color:var(--ink);}
  .wc-domain{padding:8px 0 8px 10px; margin-bottom:8px;}
  .wc-domain:last-child{margin-bottom:0;}
  .wc-domain-name{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .wc-obs{font-size:13px; line-height:1.4; margin:0 0 4px;}
  .wc-score{font-size:12px; font-weight:700;}
  .wc-reinforcement{margin-top:6px; font-size:12.5px; background:rgba(255,255,255,.04); border-radius:8px; padding:8px;}
  .wc-reinforcement strong{display:block; margin-bottom:2px;}
  .wc-reinforcement p{margin:0; color:var(--ink-dim);}

  /* --- Add weekly entry (progress note / reinforcement) form --- */
  .btn-add{background:var(--panel2); color:var(--accent2); border:1px dashed var(--line); padding:8px 14px; font-size:13px; margin-top:14px;}
  .btn-add:hover{border-color:var(--accent2);}
  #addcard-panel{margin-top:14px; background:var(--panel2); border-radius:12px; padding:16px;}
  #addcard-panel h4{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); margin:16px 0 8px;}
  #addcard-panel h4:first-of-type{margin-top:4px;}
  #addcard-panel label{font-size:12px; color:var(--ink-dim); display:block; margin-bottom:6px;}
  #addcard-panel textarea{min-height:64px; resize:vertical;}
  .addcard-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  #addcard-panel input[type=range]{padding:0; margin-bottom:14px;}
  #addcard-panel .btn-primary{width:auto; padding:9px 16px; font-size:13px;}
  #ac-status{font-size:12px; color:var(--accent2); margin-top:6px; min-height:16px;}

  /* --- Term Planner --- */
  #planner-panel{display:none; margin-top:14px; background:var(--panel2); border-radius:12px; padding:16px; text-align:left;}
  #planner-panel h4{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); margin:0 0 10px;}
  .planner-create-grid{display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; align-items:end;}
  .planner-create-grid label{font-size:12px; color:var(--ink-dim); display:block; margin-bottom:6px;}
  .planner-week{border-top:1px solid var(--line); padding:12px 0;}
  .planner-week-head{font-size:13px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .planner-week-head .wk-cur{font-size:10px; background:var(--accent2); color:#0d0e14; padding:2px 8px; border-radius:99px; font-weight:800;}
  .planner-domain-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .planner-domain-row .pd-name{flex:0 0 140px; font-size:12.5px; font-weight:600;}
  .planner-domain-row input{margin:0; flex:1;}
  .planner-domain-row button{flex:0 0 auto; padding:8px 12px; font-size:12px; background:var(--accent); color:#0d0e14;}
  #planner-status{font-size:12px; color:var(--accent2); margin-left:10px;}

  /* --- Voice screen: score ring + week navigation --- */
  #vx .orb-wrap{position:relative; width:220px; height:220px;}
  #vx .score-ring{position:absolute; inset:0; transform:rotate(-90deg);}
  #vx .score-ring circle{fill:none; stroke-width:6;}
  #vx .score-ring .rbg{stroke:rgba(255,255,255,.1);}
  #vx .score-ring .rfg{stroke-linecap:round; transition:stroke-dashoffset .6s ease, stroke .3s ease;}
  #vx-score{display:none; margin-top:6px; font-size:13px; font-weight:700; text-align:center;}
  #vx-weeknav{display:none; align-items:center; gap:10px; margin-top:10px;}
  #vx-weeknav button{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:var(--ink);
    width:30px; height:30px; border-radius:50%; font-size:15px;}
  #vx-weeknav button:disabled{opacity:.3; cursor:default;}
  #vx-weeknav .wk-label{font-size:12.5px; color:var(--ink-dim); min-width:120px; text-align:center;}
</style>
</head>
<body>

<div id="login-screen">
  <h1>Civitas Classroom</h1>
  <p>Teacher Voice Screen — sign in</p>
  <input id="login-email" type="email" placeholder="Email" autocomplete="username" />
  <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
  <div id="login-error"></div>
  <button class="btn-primary" id="login-btn">Sign in</button>
</div>

<div id="app">

  <div id="vfab"><button class="vm" id="vfab-btn" title="Call on a student by voice">🎙️</button><span class="vt" id="vfab-tip"></span></div>

  <div id="vx">
    <div class="bg"></div>
    <button class="x" id="vx-close" aria-label="Close">&times;</button>
    <div class="main">
      <nav class="rail" id="vx-rail" aria-label="Students"><div class="rh">Class roster</div></nav>
      <div class="stage">
        <div class="orb-wrap">
          <svg class="score-ring" viewBox="0 0 220 220">
            <circle class="rbg" cx="110" cy="110" r="102"></circle>
            <circle class="rfg" id="vx-ring-fg" cx="110" cy="110" r="102"></circle>
          </svg>
          <div class="orb"><i></i><i></i><i></i><div class="core" id="vx-core">🎙️</div></div>
        </div>
        <div class="nm" id="vx-name">Listening…</div>
        <div id="vx-score"></div>
        <div class="rl" id="vx-rl"></div>
        <div class="stt" id="vx-stt"></div>
        <div id="vx-weeknav">
          <button type="button" id="vx-week-prev" title="Earlier week">‹</button>
          <span class="wk-label" id="vx-week-label"></span>
          <button type="button" id="vx-week-next" title="Later week">›</button>
        </div>
      </div>
      <div class="log" id="vx-log"></div>
      <form id="vx-form"><input id="vx-input" placeholder="or type a student's name" autocomplete="off"><button>Call</button></form>
      <div class="hint" id="vx-hint">Say "call on &lt;name&gt;" or tap a student on the left · Esc to close</div>
    </div>
  </div>

  <div class="screen">
    <header>
      <div>
        <h1 id="teacher-name">—</h1>
        <div class="sub" id="class-name">—</div>
      </div>
      <button id="logout">Sign out</button>
    </header>

    <div id="roster"></div>

    <div id="detail"></div>

    <div style="margin-top:24px; text-align:center;">
      <button id="planner-toggle">📅 Term Planner</button>
      <button id="persona-toggle">✏️ My Assistant's Persona</button>
      <div id="planner-panel"></div>
      <div id="persona-panel">
        <label>Voice / tone notes (grounds the parent-facing digital twin)</label>
        <textarea id="persona-notes"></textarea>
        <button class="btn-primary" id="persona-save" style="display:inline-block;">Save</button>
        <span id="persona-status"></span>
      </div>
    </div>
  </div>
</div>

<script>
const DOMAIN_COLORS = {'--d1':'var(--d1)','--d2':'var(--d2)','--d3':'var(--d3)','--d4':'var(--d4)','--d5':'var(--d5)','--d6':'var(--d6)'};
let token = localStorage.getItem('civitas_token') || '';
let roster = [];
let domainsById = {};
let domainsList = [];
let currentClassId = null;
let activeStudentId = null;
let studentHistory = {};       // studentId -> {progressions:[], homeworks:[]}
let currentWeekInfo = null;    // from GET /classes/{id}/current-week
let currentTerm = null;        // most recent Term for this class
let voiceWeeks = [];           // grouped weekly cards for the active student, ascending
let voiceWeekIdx = -1;

function scoreBand(score) {
  if (score == null) return null;
  if (score >= 75) return {label:'Blooming', color:'var(--accent2)'};
  if (score >= 45) return {label:'Growing', color:'var(--d4)'};
  return {label:'Sprouting', color:'var(--d5)'};
}
function mondayOf(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  return date.toISOString().slice(0, 10);
}
function formatWeek(weekStart) {
  const d = new Date(weekStart + 'T00:00:00');
  return 'Week of ' + d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function groupWeeklyCards(progressions, homeworks) {
  const weeks = {};
  (progressions||[]).forEach(p => {
    weeks[p.week_start] = weeks[p.week_start] || {week_start: p.week_start, domains: {}};
    weeks[p.week_start].domains[p.domain_id] = weeks[p.week_start].domains[p.domain_id] || {};
    weeks[p.week_start].domains[p.domain_id].progression = p;
  });
  (homeworks||[]).forEach(h => {
    weeks[h.week_start] = weeks[h.week_start] || {week_start: h.week_start, domains: {}};
    weeks[h.week_start].domains[h.domain_id] = weeks[h.week_start].domains[h.domain_id] || {};
    weeks[h.week_start].domains[h.domain_id].homework = h;
  });
  return Object.values(weeks);
}

function api(path, opts={}) {
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, opts).then(async r => {
    if (!r.ok) { const t = await r.text(); throw new Error(t || r.statusText); }
    return r.json();
  });
}

document.getElementById('login-btn').onclick = doLogin;
document.getElementById('login-password').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try {
    const res = await api('/auth/login', {method:'POST', body: JSON.stringify({email, password})});
    if (res.role !== 'teacher' && res.role !== 'admin') {
      errEl.textContent = 'This screen is for teachers only.';
      return;
    }
    token = res.access_token;
    localStorage.setItem('civitas_token', token);
    document.getElementById('teacher-name').textContent = res.full_name;
    boot();
  } catch (e) {
    errEl.textContent = 'Could not sign in — check email and password.';
  }
}

document.getElementById('logout').onclick = () => {
  localStorage.removeItem('civitas_token');
  location.reload();
};

async function boot() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  const [domains, classes] = await Promise.all([api('/domains'), api('/classes/mine')]);
  domainsList = domains;
  domains.forEach(d => domainsById[d.id] = d);

  if (!classes.length) {
    document.getElementById('roster').innerHTML = '<div class="empty">No class assigned yet.</div>';
    return;
  }
  currentClassId = classes[0].id;
  document.getElementById('class-name').textContent = classes[0].name;
  await loadRoster();
  await loadPersona();
  await loadPlannerData();
}

async function loadStudentHistory(studentId) {
  if (studentHistory[studentId]) return studentHistory[studentId];
  const [progressions, homeworks] = await Promise.all([
    api(`/progression-cards/student/${studentId}`),
    api(`/homework-cards/student/${studentId}`),
  ]);
  studentHistory[studentId] = {progressions, homeworks};
  return studentHistory[studentId];
}

async function loadRoster() {
  roster = await api(`/classes/${currentClassId}/roster`);
  const el = document.getElementById('roster');
  if (!roster.length) { el.innerHTML = '<div class="empty">No students yet.</div>'; return; }
  el.innerHTML = roster.map(s => {
    const initials = s.full_name.split(' ').map(p=>p[0]).slice(0,2).join('');
    const needsFlag = s.latest_progression && s.latest_progression.needs_improvement ? '<div class="flag">⚑ needs work</div>' : '';
    return `<div class="tile" data-id="${s.id}" onclick="callOn('${s.id}')">
      <div class="avatar" style="background:var(--accent2);">${initials}</div>
      <div class="name">${s.full_name}</div>
      ${needsFlag}
    </div>`;
  }).join('');
  renderVoiceRail();
}

function domainTag(domainId) {
  const d = domainsById[domainId];
  if (!d) return '';
  const color = DOMAIN_COLORS[d.color_hint] || 'var(--accent)';
  return `<span class="domain-tag" style="background:${color}22; color:${color};">${d.name}</span>`;
}

function callOn(studentId, spoken) {
  activeStudentId = studentId;
  document.querySelectorAll('.tile').forEach(t => t.classList.toggle('active', t.dataset.id === studentId));
  const s = roster.find(r => r.id === studentId);
  if (!s) return;
  const idx = roster.findIndex(r => r.id === studentId);

  let html = `<h2>${s.full_name}</h2>`;
  if (s.latest_progression) {
    html += domainTag(s.latest_progression.domain_id);
    html += `<div class="block"><h3>This week in class</h3><p>${s.latest_progression.observation}</p>`;
    if (s.latest_progression.needs_improvement) html += `<div class="needs">Needs work: ${s.latest_progression.needs_improvement}</div>`;
    html += `</div>`;
  } else {
    html += `<div class="block"><p style="color:var(--ink-dim);">No progression notes recorded yet.</p></div>`;
  }
  if (s.latest_homework) {
    html += `<div class="block"><h3>Homework — ${s.latest_homework.title}</h3><p>${s.latest_homework.instructions}</p>`;
    if (s.latest_activity) {
      const label = s.latest_activity.engine_type === 'drill_sequence' ? '🎯 Drill activity generated'
        : s.latest_activity.engine_type === 'scenario_choice' ? '💬 Scenario activity generated'
        : '📝 Activity note generated';
      html += `<div class="activity-badge">${label} — visible to parent</div>`;
    }
    html += `</div>`;
  }

  // Weekly cards (per-domain, grouped by week) — filled in once history loads.
  html += `<div id="wc-section"><h3>Weekly cards</h3><div id="wc-strip"><div class="empty">Loading…</div></div></div>`;
  html += buildAddCardFormHTML(studentId);

  document.getElementById('detail').innerHTML = html;
  document.getElementById('detail').style.display = 'block';

  const spokenText = spoken || `Calling on ${s.full_name.split(' ')[0]}.` +
    (s.latest_progression ? ` This week: ${s.latest_progression.observation}` : '');

  // When the voice screen is open (mic tapped, or a name was just heard), the
  // call-on lands there too: the orb recolors to this student's hue, their
  // initials fill the core, and the observation shows under their name —
  // same "invoked party takes the centre" mechanic as the ODDIN voice screen.
  if (vx.classList.contains('show')) {
    vx.style.setProperty('--h', studentHue(idx));
    const initials = s.full_name.split(' ').map(p=>p[0]).slice(0,2).join('');
    vxCore.textContent = initials;
    vxName.textContent = s.full_name;
    vxRl.textContent = s.latest_progression ? s.latest_progression.observation : 'No progression notes recorded yet.';
    document.getElementById('vx-score').style.display = 'none';
    document.getElementById('vx-weeknav').style.display = 'none';
    bubble('a', spokenText);
    renderVoiceRail();
    chime();
    state('speak');
  }

  speak(spokenText, () => { if (vx.classList.contains('show')) state('listen'); });

  // Load full history in the background (cached per student) to fill the
  // weekly-cards strip and, on the voice screen, the current week's score
  // ring plus prev/next week navigation.
  loadStudentHistory(studentId).then(() => {
    if (activeStudentId !== studentId) return;
    const stripEl = document.getElementById('wc-strip');
    if (stripEl) stripEl.innerHTML = renderWeeklyCardsStrip(studentId);
    loadVoiceWeeksForStudent(studentId);
    renderVoiceWeekCard();
  });
}

// Re-renders the detail panel + weekly-cards strip for the currently
// active student without re-speaking or re-chiming — used after saving
// a new progress note / reinforcement so the teacher sees it land.
async function refreshActiveStudent() {
  if (!activeStudentId) return;
  const studentId = activeStudentId;
  delete studentHistory[studentId];
  await loadRoster();
  activeStudentId = studentId;
  document.querySelectorAll('.tile').forEach(t => t.classList.toggle('active', t.dataset.id === studentId));
  const s = roster.find(r => r.id === studentId);
  if (!s) return;

  let html = `<h2>${s.full_name}</h2>`;
  if (s.latest_progression) {
    html += domainTag(s.latest_progression.domain_id);
    html += `<div class="block"><h3>This week in class</h3><p>${s.latest_progression.observation}</p>`;
    if (s.latest_progression.needs_improvement) html += `<div class="needs">Needs work: ${s.latest_progression.needs_improvement}</div>`;
    html += `</div>`;
  } else {
    html += `<div class="block"><p style="color:var(--ink-dim);">No progression notes recorded yet.</p></div>`;
  }
  if (s.latest_homework) {
    html += `<div class="block"><h3>Homework — ${s.latest_homework.title}</h3><p>${s.latest_homework.instructions}</p></div>`;
  }
  html += `<div id="wc-section"><h3>Weekly cards</h3><div id="wc-strip"><div class="empty">Loading…</div></div></div>`;
  html += buildAddCardFormHTML(studentId);
  document.getElementById('detail').innerHTML = html;
  document.getElementById('detail').style.display = 'block';

  await loadStudentHistory(studentId);
  const stripEl = document.getElementById('wc-strip');
  if (stripEl) stripEl.innerHTML = renderWeeklyCardsStrip(studentId);
  loadVoiceWeeksForStudent(studentId);
  renderVoiceWeekCard();
}

function renderWeeklyCardsStrip(studentId) {
  const hist = studentHistory[studentId];
  if (!hist) return '<div class="empty">Loading…</div>';
  const weeks = groupWeeklyCards(hist.progressions, hist.homeworks).sort((a,b) => b.week_start.localeCompare(a.week_start));
  if (!weeks.length) return '<div class="empty">No weekly cards yet — add one below.</div>';
  return weeks.map(weekCardHTML).join('');
}

function weekCardHTML(w) {
  const bodies = Object.entries(w.domains).map(([domainId, entry]) => {
    const d = domainsById[domainId];
    const color = d ? (DOMAIN_COLORS[d.color_hint] || 'var(--accent)') : 'var(--accent)';
    let inner = `<div class="wc-domain" style="border-left:3px solid ${color}">
      <div class="wc-domain-name" style="color:${color}">${d ? d.name : 'Domain'}</div>`;
    if (entry.progression) {
      const band = scoreBand(entry.progression.stage_score);
      inner += `<p class="wc-obs">${entry.progression.observation}</p>`;
      if (band) inner += `<div class="wc-score" style="color:${band.color}">${band.label} · ${entry.progression.stage_score}</div>`;
      if (entry.progression.needs_improvement) inner += `<div class="needs">Needs work: ${entry.progression.needs_improvement}</div>`;
    }
    if (entry.homework) {
      inner += `<div class="wc-reinforcement"><strong>${entry.homework.title}</strong><p>${entry.homework.instructions}</p></div>`;
    }
    inner += `</div>`;
    return inner;
  }).join('');
  return `<div class="wcard"><div class="wcard-head">${formatWeek(w.week_start)}</div>${bodies}</div>`;
}

function buildAddCardFormHTML(studentId) {
  const defaultWeek = currentWeekInfo ? currentWeekInfo.week_start : mondayOf(new Date());
  const domainOptions = domainsList.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
  return `
    <button type="button" class="btn-add" onclick="toggleAddCard()">+ New weekly entry</button>
    <div id="addcard-panel">
      <div class="addcard-grid">
        <div><label>Domain</label><select id="ac-domain">${domainOptions}</select></div>
        <div><label>Week starting (Monday)</label><input type="date" id="ac-week" value="${defaultWeek}"></div>
      </div>
      <h4>Progress note</h4>
      <textarea id="ac-observation" placeholder="What did you observe this week?"></textarea>
      <label>Score: <span id="ac-score-val">Growing · 70</span></label>
      <input type="range" id="ac-score" min="0" max="100" value="70"
        oninput="document.getElementById('ac-score-val').textContent = scoreBand(+this.value).label + ' · ' + this.value">
      <input type="text" id="ac-needs" placeholder="Needs improvement (optional)">
      <button type="button" class="btn-primary" onclick="submitProgressNote('${studentId}')">Save progress note</button>
      <h4>Reinforcement (homework)</h4>
      <input type="text" id="ac-hw-title" placeholder="Title">
      <textarea id="ac-hw-instructions" placeholder="What should be practiced at home?"></textarea>
      <button type="button" class="btn-primary" onclick="submitReinforcement('${studentId}')">Save reinforcement</button>
      <div id="ac-status"></div>
    </div>`;
}

function toggleAddCard() {
  const p = document.getElementById('addcard-panel');
  if (p) p.style.display = p.style.display === 'block' ? 'none' : 'block';
}

async function submitProgressNote(studentId) {
  const domain_id = document.getElementById('ac-domain').value;
  const week_start = document.getElementById('ac-week').value;
  const observation = document.getElementById('ac-observation').value.trim();
  const stage_score = +document.getElementById('ac-score').value;
  const needs_improvement = document.getElementById('ac-needs').value.trim() || null;
  const statusEl = document.getElementById('ac-status');
  if (!observation) { statusEl.textContent = 'Add an observation first.'; return; }
  try {
    await api('/progression-cards', {method:'POST', body: JSON.stringify({
      student_id: studentId, domain_id, week_start, observation, stage_score, needs_improvement,
    })});
    statusEl.textContent = 'Saved ✓';
    document.getElementById('ac-observation').value = '';
    document.getElementById('ac-needs').value = '';
    await refreshActiveStudent();
  } catch (e) {
    statusEl.textContent = 'Could not save.';
  }
}

async function submitReinforcement(studentId) {
  const domain_id = document.getElementById('ac-domain').value;
  const week_start = document.getElementById('ac-week').value;
  const title = document.getElementById('ac-hw-title').value.trim();
  const instructions = document.getElementById('ac-hw-instructions').value.trim();
  const statusEl = document.getElementById('ac-status');
  if (!title || !instructions) { statusEl.textContent = 'Add a title and instructions first.'; return; }
  try {
    await api('/homework-cards', {method:'POST', body: JSON.stringify({
      student_id: studentId, domain_id, week_start, title, instructions,
    })});
    statusEl.textContent = 'Saved ✓';
    document.getElementById('ac-hw-title').value = '';
    document.getElementById('ac-hw-instructions').value = '';
    await refreshActiveStudent();
  } catch (e) {
    statusEl.textContent = 'Could not save.';
  }
}

function loadVoiceWeeksForStudent(studentId) {
  const hist = studentHistory[studentId];
  if (!hist) { voiceWeeks = []; voiceWeekIdx = -1; return; }
  voiceWeeks = groupWeeklyCards(hist.progressions, hist.homeworks).sort((a,b) => a.week_start.localeCompare(b.week_start));
  if (!voiceWeeks.length) { voiceWeekIdx = -1; return; }
  let idx = -1;
  if (currentWeekInfo && currentWeekInfo.week_start) idx = voiceWeeks.findIndex(w => w.week_start === currentWeekInfo.week_start);
  voiceWeekIdx = idx >= 0 ? idx : voiceWeeks.length - 1;
}

function renderVoiceWeekCard() {
  const nav = document.getElementById('vx-weeknav');
  const scoreWrap = document.getElementById('vx-score');
  if (!vx.classList.contains('show')) return;
  if (voiceWeekIdx < 0 || !voiceWeeks.length) {
    nav.style.display = 'none';
    scoreWrap.style.display = 'none';
    return;
  }
  const w = voiceWeeks[voiceWeekIdx];
  nav.style.display = 'flex';
  document.getElementById('vx-week-label').textContent =
    formatWeek(w.week_start) + (voiceWeeks.length > 1 ? ` (${voiceWeekIdx + 1} of ${voiceWeeks.length})` : '');
  document.getElementById('vx-week-prev').disabled = voiceWeekIdx <= 0;
  document.getElementById('vx-week-next').disabled = voiceWeekIdx >= voiceWeeks.length - 1;

  const entries = Object.values(w.domains);
  const obsParts = entries.filter(e => e.progression).map(e => e.progression.observation);
  vxRl.textContent = obsParts.length ? obsParts.join(' · ') : 'No progress note for this week.';

  const scored = entries.find(e => e.progression && e.progression.stage_score != null);
  if (scored) {
    const score = scored.progression.stage_score;
    const band = scoreBand(score);
    scoreWrap.style.display = 'block';
    scoreWrap.textContent = `${band.label} · ${score}`;
    scoreWrap.style.color = band.color;
    setScoreRing(score, band.color);
  } else {
    scoreWrap.style.display = 'none';
    setScoreRing(0, 'transparent');
  }
}

function setScoreRing(score, color) {
  const circle = document.getElementById('vx-ring-fg');
  const r = 102;
  const c = 2 * Math.PI * r;
  circle.style.strokeDasharray = `${c}`;
  circle.style.strokeDashoffset = `${c * (1 - score / 100)}`;
  circle.style.stroke = color;
}

document.getElementById('vx-week-prev').onclick = () => {
  if (voiceWeekIdx > 0) { voiceWeekIdx--; renderVoiceWeekCard(); }
};
document.getElementById('vx-week-next').onclick = () => {
  if (voiceWeekIdx < voiceWeeks.length - 1) { voiceWeekIdx++; renderVoiceWeekCard(); }
};

function speak(text, onDone) {
  if (!('speechSynthesis' in window)) { if (onDone) onDone(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.0;
  if (onDone) u.onend = onDone;
  window.speechSynthesis.speak(u);
}

/* --- Voice command (immersive, ODDIN-voice-screen theme: floating mic,
   full-screen glowing orb, listen/think/speak states, chime, roster rail,
   bubble transcript log) --- */
const HUES = [235, 166, 344, 42, 265, 198]; // same six hues as the domain tag colors (--d1..--d6)
function studentHue(idx) { return HUES[((idx % HUES.length) + HUES.length) % HUES.length]; }

function chime() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime;
    [660, 990].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t + i * .12);
      g.gain.exponentialRampToValueAtTime(0.12, t + i * .12 + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * .12 + .22);
      o.connect(g); g.connect(ac.destination);
      o.start(t + i * .12); o.stop(t + i * .12 + .25);
    });
  } catch (e) {}
}

const vx = document.getElementById('vx');
const vxLog = document.getElementById('vx-log');
const vxStt = document.getElementById('vx-stt');
const vxCore = document.getElementById('vx-core');
const vxName = document.getElementById('vx-name');
const vxRl = document.getElementById('vx-rl');
const vxRail = document.getElementById('vx-rail');
const vfab = document.getElementById('vfab');

function renderVoiceRail() {
  vxRail.innerHTML = '<div class="rh">Class roster</div>' + roster.map((s, i) => {
    const initials = s.full_name.split(' ').map(p => p[0]).slice(0, 2).join('');
    const cur = s.id === activeStudentId ? ' cur' : '';
    const needs = s.latest_progression && s.latest_progression.needs_improvement ? '<div class="rr">needs work</div>' : '';
    return `<button type="button" class="ra${cur}" data-id="${s.id}" style="--rh:${studentHue(i)}">
      <span class="ro">${initials}</span>
      <span class="rt"><div class="rn">${s.full_name}</div>${needs}</span>
    </button>`;
  }).join('');
}
vxRail.addEventListener('click', (e) => {
  const b = e.target.closest('.ra');
  if (b && !b.classList.contains('cur')) callOn(b.dataset.id);
});

function state(s, label) {
  vx.classList.remove('listen', 'think', 'speak');
  vx.classList.add(s);
  vxStt.textContent = label != null ? label : (s === 'listen' ? 'listening…' : s === 'think' ? 'thinking…' : 'speaking');
}
function bubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'b ' + cls;
  d.textContent = text;
  vxLog.appendChild(d);
  while (vxLog.children.length > 6) vxLog.removeChild(vxLog.firstChild);
  vxLog.scrollTop = vxLog.scrollHeight;
}
function openVX() {
  vx.classList.add('show');
  renderVoiceRail();
  if (!activeStudentId) { vxCore.textContent = '🎙️'; vxName.textContent = 'Listening…'; vxRl.textContent = ''; }
  state('listen');
}
function closeVX() {
  vx.classList.remove('show');
  vxLog.innerHTML = '';
  if (recognizing && rec) rec.stop();
}
document.getElementById('vx-close').onclick = closeVX;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && vx.classList.contains('show')) closeVX(); });
document.getElementById('vx-form').onsubmit = (e) => {
  e.preventDefault();
  const input = document.getElementById('vx-input');
  const v = input.value.trim();
  input.value = '';
  if (v) matchAndCall(v);
};

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizing = false;
let rec = null;

if (!SpeechRec) {
  vfab.classList.add('nosr');
  vfab.querySelector('.vm').title = 'Voice command needs Chrome. Tap a student below instead.';
} else {
  rec = new SpeechRec();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = 'en-US';

  // A real mic can get "stuck" — permission prompt dismissed without a
  // choice, a flaky connection to the browser's speech service, or the
  // tab losing focus mid-listen — and the Web Speech API doesn't always
  // fire onend/onerror when that happens. Without a fallback the button
  // would just sit there pulsing forever with no way out but a reload.
  // A hard timeout plus a visible error message covers that.
  let listenTimeout = null;
  function clearListenTimeout() {
    if (listenTimeout) { clearTimeout(listenTimeout); listenTimeout = null; }
  }
  function stopListeningUI() {
    recognizing = false;
    vfab.classList.remove('on');
    clearListenTimeout();
  }

  vfab.querySelector('.vm').onclick = () => {
    if (recognizing) { rec.stop(); closeVX(); return; }
    openVX();
    try {
      rec.start();
    } catch (e) {
      // Most commonly: rec.start() called while a previous session is
      // still tearing down (InvalidStateError). Reset and let the
      // teacher just tap again rather than leaving the button dead.
      stopListeningUI();
      bubble('n', "Mic didn't start — tap to try again.");
      state('listen', 'tap the mic to try again');
      return;
    }
    listenTimeout = setTimeout(() => {
      rec.stop();
      stopListeningUI();
      bubble('n', 'Still stuck? Reload the page and check the mic icon in the address bar.');
      state('listen', 'tap the mic to try again');
    }, 8000);
  };
  rec.onstart = () => { recognizing = true; vfab.classList.add('on'); chime(); state('listen'); };
  rec.onend = () => { stopListeningUI(); };
  rec.onerror = (e) => {
    stopListeningUI();
    const messages = {
      'not-allowed': 'Microphone access is blocked for this page — click the mic icon in the address bar to allow it.',
      'service-not-allowed': 'Microphone access is blocked for this page — click the mic icon in the address bar to allow it.',
      'no-speech': "Didn't hear anything — tap the mic and try again.",
      'audio-capture': 'No microphone found on this device.',
      'network': 'Voice recognition needs an internet connection — check yours and try again.',
    };
    bubble('n', messages[e.error] || 'Voice command hit a snag — tap the mic to try again.');
    state('listen', 'tap the mic to try again');
  };
  rec.onresult = (e) => {
    clearListenTimeout();
    const said = e.results[0][0].transcript;
    bubble('m', `"${said}"`);
    state('think');
    matchAndCall(said);
  };
}

function matchAndCall(said) {
  const lower = said.toLowerCase();
  const match = roster.find(s => {
    const first = s.full_name.split(' ')[0].toLowerCase();
    return lower.includes(first);
  });
  if (match) {
    callOn(match.id);
  } else {
    bubble('n', "Didn't catch a name I recognize.");
    state('listen', 'try again, or tap a student');
    speak("I didn't catch a name I recognize. Try again, or tap a student.");
  }
}

/* --- Term Planner --- */
document.getElementById('planner-toggle').onclick = () => {
  const p = document.getElementById('planner-panel');
  const showing = p.style.display === 'block';
  p.style.display = showing ? 'none' : 'block';
  if (!showing) renderPlannerPanel();
};

async function loadPlannerData() {
  try {
    currentWeekInfo = await api(`/classes/${currentClassId}/current-week`);
  } catch (e) {
    currentWeekInfo = null;
  }
  try {
    const terms = await api(`/classes/${currentClassId}/terms`);
    currentTerm = terms.length ? terms[0] : null;
  } catch (e) {
    currentTerm = null;
  }
}

function renderPlannerPanel() {
  const el = document.getElementById('planner-panel');
  if (!currentTerm) {
    const today = mondayOf(new Date());
    el.innerHTML = `
      <h4>Set up this term</h4>
      <div class="planner-create-grid">
        <div><label>Term name</label><input type="text" id="pl-name" placeholder="Term 1" value="Term 1"></div>
        <div><label>Start (Monday)</label><input type="date" id="pl-start" value="${today}"></div>
        <div><label>Weeks</label><input type="number" id="pl-weeks" value="10" min="1" max="52"></div>
      </div>
      <button type="button" class="btn-primary" style="width:auto; margin-top:12px;" onclick="createTerm()">Create term</button>
      <span id="planner-status"></span>`;
    return;
  }
  const weeksHtml = currentTerm.weeks.map(w => {
    const isCurrent = currentWeekInfo && currentWeekInfo.week_id === w.id;
    const domainRows = domainsList.map(d => {
      const plan = (w.plans || []).find(p => p.domain_id === d.id);
      return `<div class="planner-domain-row">
        <span class="pd-name">${d.name}</span>
        <input type="text" id="pw-${w.id}-${d.id}" placeholder="Planned focus…" value="${plan ? plan.focus.replace(/"/g,'&quot;') : ''}">
        <button type="button" onclick="saveWeekPlan('${w.id}','${d.id}')">Save</button>
      </div>`;
    }).join('');
    return `<div class="planner-week">
      <div class="planner-week-head">Week ${w.week_number} · ${formatWeek(w.week_start)} ${isCurrent ? '<span class="wk-cur">Current</span>' : ''}</div>
      ${domainRows}
    </div>`;
  }).join('');
  el.innerHTML = `<h4>${currentTerm.name} — ${currentTerm.num_weeks} weeks</h4>${weeksHtml}`;
}

async function createTerm() {
  const name = document.getElementById('pl-name').value.trim() || 'Term 1';
  const start_date = document.getElementById('pl-start').value;
  const num_weeks = +document.getElementById('pl-weeks').value;
  const statusEl = document.getElementById('planner-status');
  try {
    currentTerm = await api('/terms', {method:'POST', body: JSON.stringify({
      class_section_id: currentClassId, name, start_date, num_weeks,
    })});
    try { currentWeekInfo = await api(`/classes/${currentClassId}/current-week`); } catch (e) { currentWeekInfo = null; }
    renderPlannerPanel();
  } catch (e) {
    if (statusEl) statusEl.textContent = 'Could not create term.';
  }
}

async function saveWeekPlan(weekId, domainId) {
  const input = document.getElementById(`pw-${weekId}-${domainId}`);
  const focus = input.value.trim();
  if (!focus) return;
  try {
    await api(`/term-weeks/${weekId}/plan`, {method:'PUT', body: JSON.stringify({domain_id: domainId, focus})});
    const term = await api(`/terms/${currentTerm.id}`);
    currentTerm = term;
  } catch (e) {}
}

/* --- Persona settings --- */
document.getElementById('persona-toggle').onclick = () => {
  const p = document.getElementById('persona-panel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
};
async function loadPersona() {
  try {
    const persona = await api('/teachers/me/persona');
    document.getElementById('persona-notes').value = persona.persona_voice_notes || '';
  } catch (e) {}
}
document.getElementById('persona-save').onclick = async () => {
  const notes = document.getElementById('persona-notes').value;
  const status = document.getElementById('persona-status');
  try {
    await api('/teachers/me/persona', {method:'PUT', body: JSON.stringify({persona_voice_notes: notes})});
    status.textContent = 'Saved ✓';
    setTimeout(() => status.textContent = '', 2000);
  } catch (e) {
    status.textContent = 'Could not save';
  }
};

/* --- Auto-resume session --- */
if (token) {
  api('/classes/mine').then(() => {
    document.getElementById('teacher-name').textContent = 'Welcome back';
    boot();
  }).catch(() => { localStorage.removeItem('civitas_token'); token=''; });
}
</script>
